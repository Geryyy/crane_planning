# The `crane_planner` node of ROS 2 Interfaces 2, as the `fake` and `hardware`
# profiles compose it.
#
# Almost everything here is a property of the *solve*, not of the machine. How
# far and how fast each joint may go is read out of the `robot_description` the
# profile remaps this node onto, and deliberately does not appear below: a limit
# written down beside a node is a limit that drifts away from the description
# every controller in the same deployment was configured against. The two
# exceptions are the pump and the relief setting, which the URDF does not carry
# and nothing in this workspace can measure; they are at the end, with their
# evidence beside them.
crane_planner:
  ros__parameters:
    # The tool the profiles select. It decides which URDF joint the eighth
    # canonical coordinate is, and nothing else here changes with it.
    tool: pzs100

    # The reservation held back from *every* physical limit, so the MPC has
    # authority left to correct with. Not reachable from a request.
    kappa: 0.8

    # --- the endpoint inverse kinematics -------------------------------------
    #
    # The acceptance test, in metres and radians. It is not a closed-form
    # inverse: the passive pair is re-settled at every configuration tested, so
    # the answer is put through a forward-kinematics residual before it is used
    # and a miss over these is a `success=false` carrying the number. Raising
    # them does not make the planner better at reaching a goal; it makes it
    # quieter about missing. The restarts spread over the telescope range,
    # which is the coordinate the residual is flat in.
    eps_pos: 0.001
    eps_yaw: 0.001
    ik_restarts: 5

    # --- the geometric search ------------------------------------------------
    #
    # **The sole geometric search.** RRT-Connect runs for every request over the
    # five planned coordinates and never samples the passive pair; its result is
    # shortcut, fitted to a C2 curve and re-checked before timing. There is no
    # structured planner and no fallback branch.
    #
    # The seed is a constant and not a clock: identical requests against one
    # scene are reproducible. Exhausting the time budget is a refusal naming it.
    ompl_seed: 20420042
    ompl_time_budget: 5.0
    ompl_extension_span: 2.0
    shortcut_attempts: 120
    # Half a turn either side of what the endpoints ask for, for the rotator,
    # which is `continuous` and therefore has no range in the description to
    # sample from. Every distinct pose it has is in there, because q7 and
    # q7 + 2*pi are the same geometry.
    ompl_unbounded_margin: 3.141592653589793

    # --- what "clear" means --------------------------------------------------
    #
    # **The admissible sway bound, and this is where it lives.** The swing
    # envelope clears the path over this same box, mpc.md 3 constraint 3 imposes
    # it as a state box, and the virtual working cell consumes the same number.
    # A design value: 0.2 rad is half a metre of tool travel on a 2.5 m
    # pendulum, and it is the swing crane_supervisor's own dq_u_max was derived
    # from.
    q_sway_max: [0.2, 0.2]
    # The step the path and the sway envelope are both sampled at, in metres. It
    # is tightened to half the thinnest primitive the scene carries -- the
    # thinnest the truck brings is the bed slab at `truck_bed_thickness`, so a
    # scene with the truck in it checks at 0.05 m. A scene needing finer than the
    # floor is refused, because a path checked at a step it does not resolve is
    # not checked.
    check_resolution: 0.10
    min_check_resolution: 0.01
    max_check_samples: 2048

    # The truck, as a property of the vehicle. **The legacy dimensions,
    # preserved and no longer hard-coded**: the scene carries one primitive with
    # the reserved id `truck` and the bed and the six runges are placed on it.
    # Move the truck and they move.
    #
    # The dimensions are the legacy 0.28 x 0.31 x 2.12 and stay that way: the
    # description's post is 0.080 x 0.108 x 1.750, so the box is an inflation,
    # and `expand_truck` grows it inboard from the bed edge -- which is where the
    # real post's outer face is. It is 0.30 m taller than the real post, which
    # over-approximates and is safe.
    #
    # Stations are offsets from the box centre. For the shipped `vehicle_box`
    # they put the runges at world x -5.593, -4.381 and -1.397, which is where
    # `lkw_rungen_134.stl` stands the posts -- `post_setup:=134` in sim and its
    # subset `13` on hardware. The previous [-2.0, 0.0, 2.0] matched none of
    # them. Keep equal to `world_model.vehicle_box.runge_stations_m`.
    truck_runge_dimensions: [0.28, 0.31, 2.12]
    truck_runge_stations: [-2.261, -1.049, 1.935]
    truck_bed_thickness: 0.10
    #
    # The headboard closing the cab end of the deck -- the plate the load butts
    # against, plus the side rails behind it, as one box across the full width
    # of the bed. `lkw_ladeflaeche_mit_rammschutz_seitlich_col.stl` puts it at
    # world x -1.005 .. -0.555 reaching to z 3.186, so 0.450 thick and 1.922 off
    # a bed surface at 1.264. It is placed flush against the box's +x face,
    # which is the end the outermost runge station is at. Zero either to drop it.
    truck_headboard_thickness: 0.45
    truck_headboard_height: 1.922

    # --- the timing OCP ------------------------------------------------------
    #
    # One NLP over the path parameter, not over time. Minimising traversal time
    # is minimising the integral of dsigma/sigma_dot, and the sway is a *state*
    # of it rather than something checked afterwards -- which is what makes the
    # tool arrive at rest.
    #
    # `intervals` is the whole cost/accuracy dial: the problem is 6*N + 1
    # variables and the force and flow rows are evaluated at every node.
    # `sway_weight` and `input_weight` are what `scripts/plan_example.py` exists
    # to tune -- traversal time against how much the tool swings on the way.
    intervals: 40
    sway_weight: 2.0
    input_weight: 0.001
    # Numerical, not physical: the objective divides by sigma_dot, and at the
    # endpoints the path is at rest in q_a so nothing else bounds it.
    sigma_rate_min: 0.02
    sigma_rate_max: 2.0
    sigma_accel_max: 20.0
    # rad/s and rad/s^2. The sway rate is control_architecture's own bound; the
    # joint accelerations are a comfort limit the description does not carry.
    dq_sway_max: [1.0, 0.5]
    ddq_a_max: [0.5, 0.7, 0.5, 1.0, 6.0]
    max_wall_clock: 30.0
    max_iterations: 400
    tolerance: 1.0e-6

    # The emitted reference: 25 Hz, the rate the horizon is consumed at.
    Ts: 0.04

    # --- freshness -----------------------------------------------------------
    #
    # How old each input may be and still be planned from. `/joint_states`
    # carries the rates as well as the positions, and a message with no
    # `velocity` array is refused rather than read as a standstill.
    #
    # The passive pair has its own deadline and not one age shared with every
    # input: `sensor_msgs/JointState` has no `valid` flag, so freshness is the
    # whole test, and past it the request is refused. Reading an absent sway
    # estimate as zero is the stopped-start convention this refusal removes.
    #
    # The scene's age is its own number too: 0.5 s is the age of a 100 Hz
    # measurement of a machine that moves, while the scene is republished on a
    # 2 s heartbeat. Ten seconds fires on "the world model has stopped" and not
    # on "nothing has moved lately". It matters because that subscription is
    # transient-local: a scene published once is latched and handed to every
    # planner that starts afterwards, so without an age a dead world model reads
    # as a live one.
    max_input_age: 0.5
    pendulum_state_deadline: 0.15
    max_scene_age: 10.0
    payload_estimate_deadline: 1.0

    # --- the two hydraulic numbers the description does not carry ------------
    #
    # **Neither of them is strong, and that is why they are written down here
    # with their evidence rather than compiled in.**
    #
    # `pump_flow_max` is parameters.md 4's Q_P^max = 1.4e-3 m^3/s, *measured
    # 2023, pre-retrofit, not re-verified*: taken on a machine that has since
    # been rebuilt, and never checked against the pump that is on the crane
    # today. `pump_flow_planning_factor` is that page's own 0.95 planning
    # discount on it and is **not** a second kappa -- kappa is a separate,
    # larger reservation applied to every physical limit. The two multiply.
    # Closing this needs a flow measurement on the retrofitted machine; the
    # recordings under control_recordings/ do not contain one.
    #
    # `system_pressure_pa` is **not measured at all**. The cylinder force limit
    # is the smaller chamber area times this pressure -- the areas come from
    # crane_model, so they cannot drift -- and 250 bar is a plausible relief
    # setting for a crane of this class, not a reading off this machine. It is
    # stated rather than omitted because a force limit that does not exist is
    # the status quo this planner set out to end, and the consequence of it
    # being wrong is asymmetric: too low and the planner refuses moves the
    # machine could make, too high and the constraint stops binding before the
    # hydraulics do. Erring low is the safe direction. Replace it with the plate
    # on the power pack, or with the identification campaign of hydraulics.md
    # 5.8 -- both human-only.
    pump_flow_max: 0.0014
    pump_flow_planning_factor: 0.95
    system_pressure_pa: 25000000.0
