# The `crane_planner` node, as the `fake` and `hardware` profiles compose it.
#
# Almost everything here is a property of the *solve*, not of the machine. How
# far and how fast each joint may go is read out of the `robot_description` the
# profile remaps this node onto, and deliberately does not appear below: a limit
# written down beside a node is a limit that drifts away from the description
# every controller in the same deployment was configured against. The one
# exception is the pump, which the URDF does not carry and nothing in this
# workspace can measure; it is at the end, with its evidence beside it.
crane_planner:
  ros__parameters:
    # The tool the profiles select. It decides which URDF joint the eighth
    # canonical coordinate is, and nothing else here changes with it.
    tool: pzs100

    # The reservation held back from the pump and from every rate limit, so the
    # controller has authority left to correct with. Not reachable from a request.
    kappa: 0.8

    # --- the endpoint inverse kinematics -------------------------------------
    #
    # The acceptance test, in metres and radians. It is not a closed-form
    # inverse: the passive pair is re-settled at every configuration tested, so
    # the answer is put through a forward-kinematics residual before it is used
    # and a miss over these is a refusal carrying the number. Raising them does
    # not make the planner better at reaching a goal; it makes it quieter about
    # missing.
    #
    # `ik_restarts` applies to the **goal alone**, spread over the telescope
    # range because that is the coordinate the residual is flat in. Every sample
    # along the tool path is solved with one restart seeded from its
    # predecessor, which is both the right seed and what keeps the lifted path
    # on a single inverse-kinematics branch.
    eps_pos: 0.001
    eps_yaw: 0.001
    ik_restarts: 5

    # --- the geometric stage, and what "clear" means -------------------------
    #
    # **There is no stochastic sampling planner.** The direct TCP line is tried
    # first. If it is blocked, a bounded deterministic family of
    # lift/traverse/descend paths follows at successively higher transfer planes,
    # including symmetric lateral corridors. Every segment is lifted into the
    # five planned coordinates by continuation IK and checked there.
    #
    # Sampling does not prove clearance on its own. What makes it a proof is a
    # margin paired with a bound on how far anything can move between two
    # samples: rotating a planned joint by dq displaces any point below it by at
    # most r*dq, so if every checked configuration clears the scene by more than
    # the sum below, and no consecutive pair moves the machine further than
    # `margin_interp`, then nothing touches anything anywhere in between.
    #
    # The margin is therefore spent three ways, and each part is spent once:
    #
    #     required = margin_safety + margin_interp + swing envelope
    #
    # `margin_safety` is the clearance an answer actually carries. The swing
    # envelope is `l_tool * sin(q_sway_max)` and is computed, not configured --
    # which is why the sway box no longer has to be gridded pose by pose.
    #
    # Halving `margin_interp` roughly doubles the lifted configurations and so
    # the geometric stage's cost. Raising it spends clearance on resolution.
    margin_safety: 0.05
    margin_interp: 0.10
    # How far the tool's collision geometry reaches past the tool centre point.
    # It enters the step bound as an over-estimate of the machine's outermost
    # point: too large only costs samples, too small is unsound. The carried
    # body's own reach is added to it per request.
    tool_radius: 1.0
    # The cap on lifted configurations. Reaching it means the arm reconfigures
    # faster along the line than the line resolves -- a singularity, or an
    # inverse-kinematics branch change -- and is a refusal. It is the same test
    # that sets the resolution, which is why a branch jump cannot pass unseen.
    max_lift_samples: 4096

    # Clearance above the highest scene primitive, additional transfer planes,
    # and lateral offsets tried on each plane. The result remains bounded:
    # 1 + height_samples * (1 + 2*lateral_samples) candidates at most.
    corridor_clearance: 0.15
    corridor_height_step: 0.35
    corridor_height_samples: 3
    corridor_lateral_step: 0.50
    corridor_lateral_samples: 2

    # **The admissible sway bound, and this is where it lives.** The swing
    # envelope above is derived from it, and it is the state box the timing OCP
    # holds the pendulum inside. A design value: 0.2 rad is half a metre of tool
    # travel on a 2.5 m pendulum.
    q_sway_max: [0.2, 0.2]

    # The truck, as a property of the vehicle. **The legacy dimensions,
    # preserved and no longer hard-coded**: the scene carries one primitive with
    # the reserved id `truck` and the bed and the six runges are placed on it.
    # Move the truck and they move.
    #
    # The dimensions are the legacy 0.28 x 0.31 x 2.12 and stay that way: the
    # description's post is 0.080 x 0.108 x 1.750, so the box is an inflation,
    # and `expand_truck` grows it inboard from the bed edge -- which is where the
    # real post's outer face is. It is 0.30 m taller than the real post, which
    # over-approximates and is safe.
    #
    # Stations are offsets from the box centre. For the shipped `vehicle_box`
    # they put the runges at world x -5.593, -4.381 and -1.397, which is where
    # `lkw_rungen_134.stl` stands the posts -- `post_setup:=134` in sim and its
    # subset `13` on hardware. Keep equal to
    # `world_model.vehicle_box.runge_stations_m`.
    truck_runge_dimensions: [0.28, 0.31, 2.12]
    truck_runge_stations: [-2.261, -1.049, 1.935]
    truck_bed_thickness: 0.10
    #
    # The headboard closing the cab end of the deck -- the plate the load butts
    # against, plus the side rails behind it, as one box across the full width
    # of the bed. `lkw_ladeflaeche_mit_rammschutz_seitlich_col.stl` puts it at
    # world x -1.005 .. -0.555 reaching to z 3.186, so 0.450 thick and 1.922 off
    # a bed surface at 1.264. It is placed flush against the box's +x face,
    # which is the end the outermost runge station is at. Zero either to drop it.
    truck_headboard_thickness: 0.45
    truck_headboard_height: 1.922

    # How many cubic segments the path is fitted with, whatever the sample
    # count. **This is the dial that keeps the certificate and the curve from
    # fighting.** The certificate wants samples dense; the curve wants its first
    # and last intervals long, because the path is clamped to leave and arrive
    # at rest in q_a and that flattening has to happen somewhere. An
    # interpolating fit ties the two together and squeezes the clamp into a
    # sliver of sigma -- measured |q_a''| of 361 at sigma = 0 against 0.4 across
    # the interior, which the timing OCP reads at its first node and refuses.
    # Approximating with far fewer control points than samples gives both, and
    # stops the fit chasing inverse-kinematics noise between neighbours.
    path_segments: 12

    # --- the timing OCP ------------------------------------------------------
    #
    # One NLP over the path parameter, not over time. Minimising traversal time
    # is minimising the integral of dsigma/sigma_dot, so the end time is free --
    # that integral *is* the end time. The sway is a *state* of the problem
    # rather than something checked afterwards.
    #
    # `intervals` is the whole cost/accuracy dial: the problem is 6*N + 1
    # variables and the pump row is evaluated at every node.
    intervals: 40
    # Traversal time against how much the tool swings on the way.
    sway_weight: 2.0
    # **Effort, priced and not bounded.** `tau_a` is the actuated generalized
    # force of robot_model.md 3.3, normalised per request by what the same path
    # costs to *hold* -- so this weight is dimensionless and prices the dynamic
    # effort a fast traversal adds on top of the pose's own gravity load. It is
    # what carries the machine's inertia into the answer.
    #
    # It replaces a hard cylinder-force constraint whose limit was the smaller
    # chamber area times a relief pressure **nothing in this workspace has ever
    # measured**. The consequence is deliberate and is the trade: this planner
    # no longer refuses a move it cannot lift. It plans it, and the machine
    # stalls on it. Restoring a real bound needs a reading off the power pack or
    # the identification campaign of hydraulics.md 5.8 -- both human-only.
    tau_weight: 0.1
    input_weight: 0.001
    # **Terminal sway, as a cost.** One control -- the rate along a path the OCP
    # may not leave -- cannot in general drive four terminal quantities to zero,
    # and asking for it as a hard equality is what turns a slow answer into
    # `Infeasible_Problem_Detected`. Normalised by the admissible box, so this
    # is a multiple of "the whole allowance" and the answer reports the residual
    # in degrees. Raise it to arrive stiller and later.
    terminal_sway_weight: 200.0
    # A terminal cost is useful only if its result is judged. These are the
    # acceptance bounds: roughly the placement-scale 0.02 rad swing and the
    # supervisor's 0.04 rad/s settled-rate design value. A converged solve over
    # either one is refused rather than published as a low-sway trajectory.
    terminal_q_sway_max: [0.02, 0.02]
    terminal_dq_sway_max: [0.04, 0.04]
    # The pump row carries L1 slack for the same reason. A move needing a few
    # percent more flow than the reservation allows should come back slower and
    # say so in its message, not come back as a refusal.
    flow_slack_weight: 1000.0
    # Numerical, not physical: the objective divides by sigma_dot, and at the
    # endpoints the path is at rest in q_a so nothing else bounds it.
    sigma_rate_min: 0.02
    sigma_rate_max: 2.0
    sigma_accel_max: 20.0
    # rad/s and rad/s^2. The sway rate is control_architecture's own bound; the
    # joint accelerations are a comfort limit the description does not carry.
    dq_sway_max: [1.0, 0.5]
    ddq_a_max: [0.5, 0.7, 0.5, 1.0, 6.0]
    # Kept below the A2B caller's service timeout after reserving time for IK,
    # collision certification and output construction.
    max_wall_clock: 6.0
    max_iterations: 400
    tolerance: 1.0e-6

    # The emitted reference: 25 Hz, the rate the horizon is consumed at.
    Ts: 0.04

    # --- freshness -----------------------------------------------------------
    #
    # How old each input may be and still be planned from. `/joint_states`
    # carries the rates as well as the positions, and a message with no
    # `velocity` array is refused rather than read as a standstill.
    #
    # The passive pair has its own deadline and not one age shared with every
    # input: `sensor_msgs/JointState` has no `valid` flag, so freshness is the
    # whole test, and past it the request is refused. Reading an absent sway
    # estimate as zero is the stopped-start convention this refusal removes.
    #
    # The scene's age is its own number too: 0.5 s is the age of a 100 Hz
    # measurement of a machine that moves, while the scene is republished on a
    # 2 s heartbeat. Ten seconds fires on "the world model has stopped" and not
    # on "nothing has moved lately". It matters because that subscription is
    # transient-local: a scene published once is latched and handed to every
    # planner that starts afterwards, so without an age a dead world model reads
    # as a live one.
    max_input_age: 0.5
    pendulum_state_deadline: 0.15
    max_scene_age: 10.0
    payload_estimate_deadline: 1.0

    # --- the one hydraulic number the description does not carry -------------
    #
    # `pump_flow_max` is parameters.md 4's Q_P^max = 1.4e-3 m^3/s, *measured
    # 2023, pre-retrofit, not re-verified*: taken on a machine that has since
    # been rebuilt, and never checked against the pump that is on the crane
    # today. `pump_flow_planning_factor` is that page's own 0.95 planning
    # discount on it and is **not** a second kappa -- kappa is a separate,
    # larger reservation. The two multiply.
    #
    # Closing this needs a flow measurement on the retrofitted machine; the
    # recordings under control_recordings/ do not contain one. It is now the
    # **only** actuator limit the planner enforces, which raises what it is
    # worth to measure.
    pump_flow_max: 0.0014
    pump_flow_planning_factor: 0.95
