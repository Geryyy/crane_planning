crane_planner:
  tool:
    type: string
    default_value: "pzs100"
    read_only: true
    description: "The mounted tool. It decides which URDF joint the eighth
      canonical coordinate is -- q9_left_rail_joint on the PZS100,
      theta10_outer_jaw_joint on the Epsilon 7040 (Nomenclature 4, ROS 2
      Interfaces 3.1) -- and the model refuses a description whose selected tool
      does not carry it. The joint strings themselves come off the model, so no
      per-tool table lives in this package."
    validation:
      one_of<>: [["pzs100", "epsilon7040"]]

  eps_pos:
    type: double
    default_value: 0.001
    read_only: true
    description: "eps_p of wiki/robot_model.md 2.2, m. The position half of the
      forward-kinematics acceptance test every IK call is put through before its
      result is used. 2.2 says in as many words that the semi-analytic solve is
      not a closed-form inverse and can fail to converge, so a residual over this
      is a success=false with the residual in the message and never a returned
      trajectory. The default is a millimetre: an order of magnitude under the
      3 cm placement budget wiki/robot_model.md 5.1 works to, so a solve that
      passes here has not spent any of it."
    validation:
      gt<>: [0.0]

  eps_yaw:
    type: double
    default_value: 0.001
    read_only: true
    description: "eps_phi of wiki/robot_model.md 2.2, rad. The yaw half of the
      same acceptance test. A milliradian turns the 0.5 m half-width of a block
      by half a millimetre, which is the same order as eps_pos and is why the two
      defaults are the same number."
    validation:
      gt<>: [0.0]

  d45_samples:
    type: int
    default_value: 41
    read_only: true
    description: "How many telescope extensions the scalar search of
      wiki/robot_model.md 2.2 step 3 evaluates. The redundancy is one degree of
      freedom and the score -- joint-range centring -- is smooth in it, so this
      is a resolution and not a convergence criterion: a coarser grid picks a
      slightly less well centred extension, never a wrong one, because whatever
      it picks is closed in closed form and then validated against forward
      kinematics like every other candidate."
    validation:
      gt_eq<>: [2]

  fixed_point_iterations:
    type: int
    default_value: 4
    read_only: true
    description: "Budget for the wrist-offset fixed point of
      wiki/robot_model.md 2.2 step 4, which is also where step 5 rides -- the
      rotator takes the residual yaw once per iteration, at the sensitivity the
      description actually has rather than at an assumed one. Every iteration
      re-solves the passive pair at the configuration it is testing, so this and
      refinement_iterations together are what a solve costs:
      Model::passive_equilibrium runs some 45 ms against 0.35 ms for a
      forward-kinematics call. The offset it corrects is the tool's hanging
      length, which barely moves, so the fixed point contracts hard and stops on
      its own after two or three iterations; exceeding the budget is reported as
      a residual rather than papered over."
    validation:
      gt_eq<>: [1]

  refinement_iterations:
    type: int
    default_value: 6
    read_only: true
    description: "Budget for the Jacobian polish that closes whatever residual
      the search and the fixed point leave. It is not a second solver and not a
      silent fallback: it starts from the semi-analytic solution, it is skipped
      entirely when that solution already meets eps_pos and eps_yaw, it
      backtracks on the true residual so it cannot make the answer worse, and how
      many iterations it took is reported in the service response. Set it to zero
      to run the bare semi-analytic solve of 2.2 and nothing else."
    validation:
      gt_eq<>: [0]

  eps_equilibrium:
    type: double
    default_value: 1.0e-4
    read_only: true
    description: "How far the endpoint's passive pair may sit from
      Model::passive_equilibrium of its own actuated part, rad. This is the
      *assertion* wiki/trajectory_planning.md 6 rests on and not the solver's own
      constraint residual: g_u(q) = 0 has more than one root -- the tool hanging
      down and the tool standing up -- and only the first is a steady state
      anything settles into, so the answer is put back through the frozen model
      API and compared. Loose enough to absorb the model's equilibrium solve
      landing on a slightly different point than the NLP did, and tight enough
      that the standing-up root, which is radians away, can never pass."
    validation:
      gt<>: [0.0]

  nlp_max_iterations:
    type: int
    default_value: 60
    read_only: true
    description: "Iteration cap on the equilibrium-constrained solve of
      wiki/robot_model.md 2.2, in Gauss-Newton steps. Hitting it is a refusal
      naming the cap, never the best iterate dressed as an answer: a solve that
      was still moving when it was stopped holds an iterate, and nothing
      establishes that the next step would not have moved it back outside the
      acceptance residual. Warm-started from the semi-analytic route this is one
      iteration on the PZS100, whose seed is exact; the 7040's tool sits off the
      tilt axis, so its seed is only close and the worst of twenty five sampled
      goals took 24. Sixty is that with room. The latency bound this feeds is
      issue 045's; the cap exists here because an unbounded NLP inside a service
      call is a hang and a caller cannot cancel one."
    validation:
      gt_eq<>: [1]

  nlp_max_wall_clock:
    type: double
    default_value: 5.0
    read_only: true
    description: "Wall-clock cap on the same solve, s, measured across the whole
      of it including the semi-analytic seed. The other half of the bound, and the
      half that holds when a machine is slower than the one the iteration count
      was measured on: one solve costs 0.25 s on the PZS100 and 0.73 s at its
      worst on the 7040. Hitting it is the same refusal, naming this cap."
    validation:
      gt<>: [0.0]

  geometry_samples:
    type: int
    default_value: 9
    read_only: true
    description: "How many telescope extensions the two-link structure check runs
      over at startup. The four numbers of wiki/robot_model.md 2.2 -- a2, a3,
      d45(q4) and the bearing they are measured from -- are probed out of the
      model rather than written down here, and this is the over-determination
      that turns the probe into a check: a description whose arm is not planar,
      or whose telescope does not extend affinely in q4, fails to start."
    validation:
      gt_eq<>: [3]

  geometry_tolerance:
    length:
      type: double
      default_value: 1.0e-6
      read_only: true
      description: "How far a description may depart from the planar two-link arm
        of wiki/robot_model.md 2.2 and still be planned for, m. Both machine
        descriptions in this workspace close to floating-point noise, so this is
        a guard against a *different* crane rather than a fitted tolerance."
      validation:
        gt<>: [0.0]
    bearing:
      type: double
      default_value: 1.0e-6
      read_only: true
      description: "The same guard on the forearm's bearing offset, rad."
      validation:
        gt<>: [0.0]

  transfer_altitude_floor:
    type: double_array
    default_value: []
    read_only: true
    description: "An optional floor on the transfer altitude the structured
      primitive of wiki/trajectory_planning.md 4.4 lifts to, m in
      K0_mounting_base. Empty means no floor, and empty is the default, because
      4.4 read against 9's open items says the altitude comes from the scene: it
      is derived from the two endpoints raised by the mounted tool's own reach,
      and from the obstacle extent once issue 041 supplies one. A floor may only
      raise that derivation and can therefore never be the answer -- with no
      endpoints there is no altitude here at all, whatever this says. A
      deployment sets it when the site has a known minimum transit height the
      endpoints do not imply. At most one element."
    validation:
      size_lt<>: [2]

  transfer_altitude_ceiling:
    type: double_array
    default_value: []
    read_only: true
    description: "An optional ceiling on the same derivation, m in
      K0_mounting_base, empty by default. It may only lower the derived altitude.
      Set below both endpoints it makes the primitive impossible rather than
      short, and the lift phase is then refused by name -- the primitive is
      refused, never deformed, because a lift that does not clear what it was
      derived to clear is worse than no plan at all. At most one element."
    validation:
      size_lt<>: [2]

  path_rate_headroom:
    type: double
    default_value: 2.0
    read_only: true
    description: "Peak |q_a'(sigma)| a segment of the primitive is allowed, as a
      multiple of its own mean rate. This is a *shape* number and not a machine
      limit: sigma is a path parameter, not a time, and nothing in stage 1
      establishes what the machine can traverse -- the velocity, acceleration,
      force and pump-flow feasibility all arrive with the path-constrained OCP of
      5.2, which is issue 043. Two gives the jerk-limited profile a genuine
      plateau instead of a triangle, so the path accelerates over roughly a
      quarter of each segment, cruises, and decelerates again."
    validation:
      gt<>: [1.0]

  path_acceleration_span:
    type: double
    default_value: 4.0
    read_only: true
    description: "Segment spans the interpolation's acceleration bound is
      expressed in, so that the profile has the same shape on a segment that
      travels a metre and on one that travels a millimetre. Same caveat as
      path_rate_headroom: it shapes how sigma is distributed and claims nothing
      about q_a''(sigma) being reachable in time."
    validation:
      gt<>: [0.0]

  path_jerk_span:
    type: double
    default_value: 4.0
    read_only: true
    description: "The same, one derivative up. It is what rounds the corners of
      the acceleration profile, and a jerk-limited profile is why q_a''(sigma) is
      continuous -- and therefore *defined* -- everywhere rather than only away
      from the junctions. wiki/trajectory_planning.md 4.5 is why that matters: at
      a point of discontinuous curvature the path-velocity limit collapses to
      sigma_dot = 0 and the machine stops dead at the waypoint."
    validation:
      gt<>: [0.0]

  Ts:
    type: double
    default_value: 0.04
    read_only: true
    description: "Sample period of the emitted reference, s. 25 Hz, which is the
      rate crane_mpc publishes its horizon at (ROS 2 Interfaces 4) and therefore
      the grid the reference is consumed on. It is a sampling of a continuous
      ramp, not a control period: nothing in this node runs in a cycle."
    validation:
      gt<>: [0.0]

  min_duration:
    type: double
    default_value: 0.5
    read_only: true
    description: "Floor on the traversal time, s. Without it a goal a few
      millimetres away would be handed over in microseconds, and a reference
      shorter than the loop it is tracked by is a step, not a trajectory."
    validation:
      gt<>: [0.0]

  max_input_age:
    type: double
    default_value: 0.5
    read_only: true
    description: "Longest age of /joint_states that still counts as a start
      state, s, measured against the message's own header stamp. The plan begins
      at the machine's measured configuration and its header.stamp is that
      measurement's stamp (ROS 2 Interfaces 1: the absolute time the first point
      is valid for), so a stale measurement is a first point that was valid
      seconds ago. Planning from a *moving* start, and the latency bound that
      goes with it, is issue 045; this issue plans from a machine that is
      standing still and refuses when it cannot tell."
    validation:
      gt<>: [0.0]
