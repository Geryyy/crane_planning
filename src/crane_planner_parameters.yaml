crane_planner:
  tool:
    type: string
    default_value: "pzs100"
    read_only: true
    description: "The mounted tool. It decides which URDF joint the eighth
      canonical coordinate is -- q9_left_rail_joint on the PZS100,
      theta10_outer_jaw_joint on the Epsilon 7040 (Nomenclature 4, ROS 2
      Interfaces 3.1) -- and the model refuses a description whose selected tool
      does not carry it. The joint strings themselves come off the model, so no
      per-tool table lives in this package."
    validation:
      one_of<>: [["pzs100", "epsilon7040"]]


  eps_pos:
    type: double
    default_value: 0.001
    read_only: true
    description: "eps_p of wiki/robot_model.md 2.2, m. The position half of the
      forward-kinematics acceptance test every IK call is put through before its
      result is used. 2.2 says in as many words that the semi-analytic solve is
      not a closed-form inverse and can fail to converge, so a residual over this
      is a success=false with the residual in the message and never a returned
      trajectory. The default is a millimetre: an order of magnitude under the
      3 cm placement budget wiki/robot_model.md 5.1 works to, so a solve that
      passes here has not spent any of it."
    validation:
      gt<>: [0.0]

  eps_yaw:
    type: double
    default_value: 0.001
    read_only: true
    description: "eps_phi of wiki/robot_model.md 2.2, rad. The yaw half of the
      same acceptance test. A milliradian turns the 0.5 m half-width of a block
      by half a millimetre, which is the same order as eps_pos and is why the two
      defaults are the same number."
    validation:
      gt<>: [0.0]

  d45_samples:
    type: int
    default_value: 41
    read_only: true
    description: "How many telescope extensions the scalar search of
      wiki/robot_model.md 2.2 step 3 evaluates. The redundancy is one degree of
      freedom and the score -- joint-range centring -- is smooth in it, so this
      is a resolution and not a convergence criterion: a coarser grid picks a
      slightly less well centred extension, never a wrong one, because whatever
      it picks is closed in closed form and then validated against forward
      kinematics like every other candidate."
    validation:
      gt_eq<>: [2]

  fixed_point_iterations:
    type: int
    default_value: 4
    read_only: true
    description: "Budget for the wrist-offset fixed point of
      wiki/robot_model.md 2.2 step 4, which is also where step 5 rides -- the
      rotator takes the residual yaw once per iteration, at the sensitivity the
      description actually has rather than at an assumed one. Every iteration
      re-solves the passive pair at the configuration it is testing, so this and
      refinement_iterations together are what a solve costs:
      Model::passive_equilibrium runs some 45 ms against 0.35 ms for a
      forward-kinematics call. The offset it corrects is the tool's hanging
      length, which barely moves, so the fixed point contracts hard and stops on
      its own after two or three iterations; exceeding the budget is reported as
      a residual rather than papered over."
    validation:
      gt_eq<>: [1]

  refinement_iterations:
    type: int
    default_value: 6
    read_only: true
    description: "Budget for the Jacobian polish that closes whatever residual
      the search and the fixed point leave. It is not a second solver and not a
      silent fallback: it starts from the semi-analytic solution, it is skipped
      entirely when that solution already meets eps_pos and eps_yaw, it
      backtracks on the true residual so it cannot make the answer worse, and how
      many iterations it took is reported in the service response. Set it to zero
      to run the bare semi-analytic solve of 2.2 and nothing else."
    validation:
      gt_eq<>: [0]

  eps_equilibrium:
    type: double
    default_value: 1.0e-4
    read_only: true
    description: "How far the endpoint's passive pair may sit from
      Model::passive_equilibrium of its own actuated part, rad. This is the
      *assertion* wiki/trajectory_planning.md 6 rests on and not the solver's own
      constraint residual: g_u(q) = 0 has more than one root -- the tool hanging
      down and the tool standing up -- and only the first is a steady state
      anything settles into, so the answer is put back through the frozen model
      API and compared. Loose enough to absorb the model's equilibrium solve
      landing on a slightly different point than the NLP did, and tight enough
      that the standing-up root, which is radians away, can never pass."
    validation:
      gt<>: [0.0]

  nlp_max_iterations:
    type: int
    default_value: 60
    read_only: true
    description: "Iteration cap on the equilibrium-constrained solve of
      wiki/robot_model.md 2.2, in Gauss-Newton steps. Hitting it is a refusal
      naming the cap, never the best iterate dressed as an answer: a solve that
      was still moving when it was stopped holds an iterate, and nothing
      establishes that the next step would not have moved it back outside the
      acceptance residual. Warm-started from the semi-analytic route this is one
      iteration on the PZS100, whose seed is exact; the 7040's tool sits off the
      tilt axis, so its seed is only close and the worst of twenty five sampled
      goals took 24. Sixty is that with room. The latency bound this feeds is
      issue 045's; the cap exists here because an unbounded NLP inside a service
      call is a hang and a caller cannot cancel one."
    validation:
      gt_eq<>: [1]

  nlp_max_wall_clock:
    type: double
    default_value: 5.0
    read_only: true
    description: "Wall-clock cap on the same solve, s, measured across the whole
      of it including the semi-analytic seed. The other half of the bound, and the
      half that holds when a machine is slower than the one the iteration count
      was measured on: one solve costs 0.25 s on the PZS100 and 0.73 s at its
      worst on the 7040. Hitting it is the same refusal, naming this cap."
    validation:
      gt<>: [0.0]

  geometry_samples:
    type: int
    default_value: 9
    read_only: true
    description: "How many telescope extensions the two-link structure check runs
      over at startup. The four numbers of wiki/robot_model.md 2.2 -- a2, a3,
      d45(q4) and the bearing they are measured from -- are probed out of the
      model rather than written down here, and this is the over-determination
      that turns the probe into a check: a description whose arm is not planar,
      or whose telescope does not extend affinely in q4, fails to start."
    validation:
      gt_eq<>: [3]

  geometry_tolerance:
    length:
      type: double
      default_value: 1.0e-6
      read_only: true
      description: "How far a description may depart from the planar two-link arm
        of wiki/robot_model.md 2.2 and still be planned for, m. Both machine
        descriptions in this workspace close to floating-point noise, so this is
        a guard against a *different* crane rather than a fitted tolerance."
      validation:
        gt<>: [0.0]
    bearing:
      type: double
      default_value: 1.0e-6
      read_only: true
      description: "The same guard on the forearm's bearing offset, rad."
      validation:
        gt<>: [0.0]


  path_rate_headroom:
    type: double
    default_value: 2.0
    read_only: true
    description: "Peak |q_a'(sigma)| a segment of the primitive is allowed, as a
      multiple of its own mean rate. This is a *shape* number and not a machine
      limit: sigma is a path parameter, not a time, and nothing in stage 1
      establishes what the machine can traverse -- the velocity, acceleration,
      force and pump-flow feasibility all arrive with the path-constrained OCP of
      5.2, which is issue 043. Two gives the jerk-limited profile a genuine
      plateau instead of a triangle, so the path accelerates over roughly a
      quarter of each segment, cruises, and decelerates again."
    validation:
      gt<>: [1.0]

  path_acceleration_span:
    type: double
    default_value: 4.0
    read_only: true
    description: "Segment spans the interpolation's acceleration bound is
      expressed in, so that the profile has the same shape on a segment that
      travels a metre and on one that travels a millimetre. Same caveat as
      path_rate_headroom: it shapes how sigma is distributed and claims nothing
      about q_a''(sigma) being reachable in time."
    validation:
      gt<>: [0.0]

  path_jerk_span:
    type: double
    default_value: 4.0
    read_only: true
    description: "The same, one derivative up. It is what rounds the corners of
      the acceleration profile, and a jerk-limited profile is why q_a''(sigma) is
      continuous -- and therefore *defined* -- everywhere rather than only away
      from the junctions. wiki/trajectory_planning.md 4.5 is why that matters: at
      a point of discontinuous curvature the path-velocity limit collapses to
      sigma_dot = 0 and the machine stops dead at the waypoint."
    validation:
      gt<>: [0.0]

  ompl_seed:
    type: int
    default_value: 20420042
    read_only: true
    description: "The seed the sole OMPL planner of wiki/trajectory_planning.md
      4.4 draws every sample and every shortcut pair from. **A constant, and
      never a clock.** A stochastic planner in an automated suite is the
      flaky-test failure the PRD's testing decisions rule out, so this makes two
      identical requests against one scene give one answer and makes a test get
      the answer the deployment would. The generator is this package's own
      std::mt19937 and not OMPL's global one, which can be seeded once per
      process and would leave whichever test ran second irreproducible. Change it
      to explore a scene this seed happens to do badly on; do not derive it from
      the time."
    validation:
      gt_eq<>: [0]

  ompl_time_budget:
    type: double
    default_value: 5.0
    read_only: true
    description: "Wall-clock cap on one RRT-Connect search, s. Exhausting it is a
      refusal naming the cap and never an approximate path: a path that stops
      short of the goal is not a worse answer than none, it is an answer that
      reads as success, and stage 2 would time the machine straight into whatever
      the search had not got round yet. This is a **per-call** cap on the
      fallback and is not the replanning loop's latency bound, which is issue
      045's."
    validation:
      gt<>: [0.0]

  ompl_max_validity_checks:
    type: int
    default_value: 4000
    read_only: true
    description: "Cap on the configurations one search may check, whatever the
      clock says. The half of the bound that does not depend on how fast the
      machine running the planner is, and therefore the half a test can rely on.
      Each check is a Model::passive_equilibrium -- some 45 ms, because the pose
      the tool hangs in is a function of the configuration -- plus the collision
      queries of its sway envelope, so this is also the honest unit of what a
      search costs. The smoothing pass of 4.5 is given the same allowance again
      rather than the search's leftovers, so how hard a search was does not
      decide how much smoothing its answer may have."
    validation:
      gt_eq<>: [2]

  ompl_extension_span:
    type: double
    default_value: 2.0
    read_only: true
    description: "Longest motion the search's trees may extend by, in the state
      space's own metric -- the sum over the five path coordinates of |dq| /
      dq_max, i.e. seconds at each axis's own limit. That is the unit
      geometric_path.hpp already distributes sigma by, and the only unit in which
      radians of slewing and metres of telescope are comparable at all. Zero asks
      OMPL for its own default, a fraction of the space's extent, which knows
      nothing about this machine."
    validation:
      gt_eq<>: [0.0]

  shortcut_attempts:
    type: int
    default_value: 120
    read_only: true
    description: "How many replacements the shortcut pass of
      wiki/trajectory_planning.md 4.5 tries on a sampled polyline. Every one is
      put through the same motion validation the search used, so a larger number
      buys a shorter path and never a less checked one -- and the collision
      answer for what it produces is still the re-check that runs after the C2
      fit, because the fit is not the polyline. Zero skips the pass, which leaves
      the fit a raw RRT path with every one of its waypoints in it."
    validation:
      gt_eq<>: [0]

  ompl_unbounded_margin:
    type: double
    default_value: 3.141592653589793
    read_only: true
    description: "How far past the interval its two endpoints span an
      **unbounded** path coordinate may be searched, rad. The rotator is a
      `continuous` joint in both descriptions -- it turns without end
      (wiki/nomenclature.md 4) -- so the description gives it no range and a
      sampler still needs one. Half a turn either side is every distinct pose it
      has, because q7 and q7 + 2 pi are the same geometry: wider samples poses
      the search has already been offered, narrower hides some. The four bounded
      coordinates take the description's own range and nothing here touches
      them."
    validation:
      gt<>: [0.0]

  Ts:
    type: double
    default_value: 0.04
    read_only: true
    description: "Sample period of the emitted reference, s. 25 Hz, which is the
      rate crane_mpc publishes its horizon at (ROS 2 Interfaces 4) and therefore
      the grid the reference is consumed on. It is a sampling of a continuous
      ramp, not a control period: nothing in this node runs in a cycle."
    validation:
      gt<>: [0.0]


  q_sway_max:
    type: double_array
    default_value: [0.2, 0.2]
    read_only: true
    description: "The admissible sway bound q_u^+ of wiki/nomenclature.md 8, rad,
      over [tip, tilt] -- the same order tip_tilt_state_broadcaster names them on
      /joint_states. **This is where that bound lives.** wiki/mpc.md 3 constraint
      3 imposes |q_u - q_eq| <= q_u^+ as a state box and
      wiki/trajectory_planning.md 4.3 clears the path over the same box, so any
      sway the MPC permits is sway the path was cleared for by construction and
      not by coincidence; the virtual working cell of
      wiki/control_architecture.md 5.1 consumes the same number and, by that
      section's own rule, derives its envelope independently of this planner's
      data.
      **A design value, not a measured one.** 0.2 rad is roughly 11 degrees, half
      a metre of tool travel on a 2.5 m pendulum, and it is the same swing
      crane_supervisor's dq_u_max was derived from -- 0.4 rad/s is its peak rate
      at the pendulum's own 2 rad/s -- so the two are consistent by construction.
      What would replace it is a recording of a grip approach with the load
      swinging, machine and human, like merge gate (ii-b). Read-only: a sway
      bound that can be widened under a running planner is not one anybody can
      reason about."
    validation:
      fixed_size<>: [2]
      element_bounds<>: [0.0, 1.5]

  check_resolution:
    type: double
    default_value: 0.10
    read_only: true
    description: "The largest distance any watched frame of the crane may travel
      between two configurations the collision check looks at, m. A path checked
      only at its waypoints is not checked, and this is what 'checked' means
      here. It is also the step the sway envelope of 4.3 is gridded with, in tool
      travel.
      Its relation to the geometry is the reason for the number: a step coarser
      than the thinnest primitive being checked can carry the tool from one side
      of that primitive to the other with no sample inside it, so the check
      tightens this to **half** the thinnest extent in the scene when the scene
      carries something thinner -- half rather than all of it because the sway
      grid is two-dimensional and can cross a box corner to corner. The legacy
      runges are 0.28 m across, so a scene carrying them checks at 0.14 m. This
      is a sampling rule and not a proof: the frozen model API answers for a
      configuration and not for the sweep between two."
    validation:
      gt<>: [0.0]

  min_check_resolution:
    type: double
    default_value: 0.01
    read_only: true
    description: "Floor on the step a scene may tighten check_resolution to, m. A
      scene carrying something so thin that resolving it would need a finer step
      than this is **refused** rather than checked at a step that does not
      resolve it, because a path checked at a step it does not resolve is not
      checked. Two centimetres of primitive is already below anything this
      machine's own geometry is fitted to."
    validation:
      gt<>: [0.0]

  max_check_samples:
    type: int
    default_value: 2048
    read_only: true
    description: "Cap on the configurations one path may be checked at. Each one
      costs a Model::passive_equilibrium -- some 45 ms, because the pose the tool
      hangs in is a function of the configuration -- plus the collision queries
      of its sway envelope, so this is the bound that keeps a long path at a fine
      resolution from turning a service call into a hang. Hitting it is a refusal
      naming the travel and the step; collision_queries is not a real-time call
      (crane_model's README) and nothing here puts it on one."
    validation:
      gt_eq<>: [2]

  max_sway_samples:
    type: int
    default_value: 15
    read_only: true
    description: "Cap on the poses the sway envelope is resolved with, per
      passive coordinate. The grid is only walked where the nominal clearance is
      smaller than Delta_sway = l_tool sin(max|q_u^+|) -- everywhere else that
      inequality already proves no admissible sway can reach anything, which is
      trajectory_planning 4.3's own envelope used as the sufficient condition it
      is. Hitting the cap is a refusal naming the numbers rather than a coarser
      grid, because a coarser grid leaves sway the MPC permits unchecked."
    validation:
      gt_eq<>: [1]

  clearance_weight:
    type: double
    default_value: 1.0
    read_only: true
    description: "How heavily collision clearance counts in the telescope
      redundancy score of wiki/robot_model.md 2.2 step 3, against joint-range
      centring. Step 3 names both terms and this is the second one: one
      Model::collision_query per candidate extension, at the configuration that
      extension closes on. Zero asks for the centring-only redundancy. It is a
      *preference* and not the check -- the check is the one along the path, and
      it refuses."
    validation:
      gt_eq<>: [0.0]

  clearance_reference:
    type: double
    default_value: 0.5
    read_only: true
    description: "The clearance above which one telescope extension is as good as
      another, m. Above it the clearance term is zero and centring decides; below
      it the term rises, and a candidate actually in collision loses to any
      candidate that is not, whatever its centring. Half a metre is the order of
      the gap between the runges and the tool descending between them."
    validation:
      gt<>: [0.0]

  truck:
    runge_dimensions:
      type: double_array
      default_value: [0.28, 0.31, 2.12]
      read_only: true
      description: "One runge, as an extent along the bed's own axes: along the
        bed, across it, and up, m. **The legacy geometry, preserved.** The
        timber planner carried two rows of three boxes of exactly these
        dimensions, hard-coded as postsRight/postsLeft in a motion-planning YAML
        together with the bed. trajectory_planning 4.2 asks for the geometry to
        be kept and the hard-coding dropped: what is configured here is a
        property of the *vehicle*, and where it lands in K0_mounting_base comes
        from the measured pose the scene carries on the primitive with the
        reserved id 'truck'. Move the truck and the runges move with it."
      validation:
        fixed_size<>: [3]
        element_bounds<>: [0.0, 100.0]
    runge_stations:
      type: double_array
      default_value: [-2.0, 0.0, 2.0]
      read_only: true
      description: "Where the runge stations sit along the bed, measured from its
        centre, m. One runge per station per side, so the default is 4.2's two
        rows of three. A station that would hang a runge off the end of the
        measured bed is refused naming both numbers, because a truck model that
        does not fit the truck it was keyed to is a model of a different vehicle.
        **A design value:** the legacy YAML's own station positions are not in
        this workspace, only the box dimensions are, so these three are spaced
        for a timber bed and a deployment measuring its own truck should replace
        them."
      validation:
        element_bounds<>: [-100.0, 100.0]
    bed_thickness:
      type: double
      default_value: 0.10
      read_only: true
      description: "How thick a slab the load area enters the scene as, m, at the
        top face of the measured truck box. The crane is bolted to the truck, so
        checking every link against the whole vehicle box would report the crane
        colliding with the vehicle it is part of; what the arm has to clear is
        the surface the load sits on. The runges stand on that face."
      validation:
        gt<>: [0.0]

  max_input_age:
    type: double
    default_value: 0.5
    read_only: true
    description: "Longest age of /joint_states that still counts as a start
      state, s, measured against the message's own header stamp. The plan begins
      at the machine's measured configuration and its header.stamp is that
      measurement's stamp (ROS 2 Interfaces 1: the absolute time the first point
      is valid for), so a stale measurement is a first point that was valid
      seconds ago."
    validation:
      gt<>: [0.0]

  max_scene_age:
    type: double
    default_value: 10.0
    read_only: true
    description: "Longest age of /crane/collision_scene that still counts as the
      world, s, measured against the message's own header stamp. Deliberately not
      max_input_age: that one is 0.5 s because /joint_states is a 100 Hz
      measurement of a machine that moves, while the scene's natural rate is the
      world model's republish heartbeat, which is seconds. The default assumes
      the world model republishes at least every few seconds; the perception
      orchestrator's collision_scene_heartbeat is 2.0 s, so 10 s is five
      heartbeats and reads as 'the world model has stopped' rather than as
      'nothing has moved lately'. Past it the scene is not planned against, and
      the request is refused when avoid_collisions is set and annotated when it
      is not."
    validation:
      gt<>: [0.0]

  pendulum_state_deadline:
    type: double
    default_value: 0.15
    read_only: true
    description: "Freshness deadline of the passive pair on /joint_states, s. The 150 ms of
      wiki/control_architecture.md 5.3's own table, which is where every input a
      consumer closes on gets a deadline of its own -- a 100 Hz stream and a
      20 Hz contract do not go stale at the same age, so this is per input and
      not one number for all of them. Past it the measurement is 'died' as
      opposed to 'never connected', and passive_estimate_policy decides what
      happens next. sensor_msgs/JointState carries no validity flag, so this is
      the only failure the source can report."
    validation:
      gt<>: [0.0]

  payload_estimate_deadline:
    type: double
    default_value: 1.0
    read_only: true
    description: "Freshness deadline of /crane/payload_estimate, s. Not in
      control_architecture 5.3's table, because the supervisor does not watch
      this row; it is ten periods of the 10 Hz publication ROS 2 Interfaces 4
      gives it. Past it the payload is the one the request declared, and the
      answer says so."
    validation:
      gt<>: [0.0]

  passive_estimate_policy:
    type: string
    default_value: "refuse"
    read_only: true
    description: "What this deployment does when the passive pair on
      /joint_states is not usable -- never connected, or past its deadline.
      'refuse' returns success=false naming which of the two it was, which is
      control_architecture 5.3's row for a state a consumer closes on.
      'conservative' plans from the hanging pose of the measured actuated
      configuration and holds back conservative_sway of the sway allowance for
      the sway that may be there anyway, saying so in the answer. There is no
      third value, because reading an absent estimate as zero sway is the
      stopped-start convention wiki/trajectory_planning.md 7 removes."
    validation:
      one_of<>: [["refuse", "conservative"]]

  conservative_sway:
    q_u:
      type: double
      default_value: 0.05
      read_only: true
      description: "Sway angle held back from mpc 3 constraint 3's box when the
        passive estimate is not usable and the policy is 'conservative', rad.
        A reservation and not an assumption: the plan is solved inside a smaller
        box, so sway up to this much can be present without leaving what the
        controller permits or what trajectory_planning 4.3 cleared the path
        over. **A design value** -- no recording measures the sway at the moment
        a re-plan is issued."
      validation:
        gt_eq<>: [0.0]
    dq_u:
      type: double
      default_value: 0.10
      read_only: true
      description: "The same reservation on the sway *rate*, rad/s, against
        mpc 3 constraint 4. **A design value**, on the same terms as q_u above."
      validation:
        gt_eq<>: [0.0]

  at_rest:
    dq_a:
      type: double
      default_value: 0.0001
      read_only: true
      description: "Below this an actuated coordinate is standing still rather
        than moving, rad/s or m/s. It decides one thing: whether a request is a
        re-plan from a moving machine at all (wiki/trajectory_planning.md 7).
        Below it the path meets its start at rest, as every plan did before
        issue 045; above it the measured velocity becomes the first segment's own
        boundary condition and pins the OCP's sigma_dot(0)."
      validation:
        gt<>: [0.0]
    dq_u:
      type: double
      default_value: 0.002
      read_only: true
      description: "Below this the tool is hanging still rather than swinging,
        rad/s. The gyro quantiser is 2^-9 rad/s = 0.00195 rad/s, measured from
        the 7040 recordings, so a differenced sway rate under it is quantisation
        and not sway. Used only to describe the start; the sway itself is carried
        into the OCP whatever this says."
      validation:
        gt<>: [0.0]

  latency_budget:
    type: double
    default_value: 45.0
    read_only: true
    description: "The latency bound of wiki/trajectory_planning.md 7, s, over
      the whole of one request -- the endpoint IK, the geometry, the smoothing
      and the OCP. Enforced **in the planner** and not in the caller's timeout:
      7 is explicit that bounding only how long the caller waits leaves a slow
      solve running under a request nobody is waiting on. Exceeding it returns
      success=false naming the stage that overran and how long it had, keeps the
      previous trajectory standing on /crane/reference and emits no partial plan.
      Sized against what a plan costs rather than round -- one plan is some 14 s
      here, of which kappa's OCP share (max_wall_clock) is 12 s -- because a
      bound is only a bound if the ordinary case clears it on a slower machine
      too. A value at or below zero is no budget at all, and the stages are then
      charged and reported without any of them being able to refuse."

  kappa:
    type: double
    default_value: 0.8
    read_only: true
    description: "The margin of wiki/trajectory_planning.md 5.5: the fraction of
      the machine's actuation authority the planner is allowed to spend, applied
      to every physical limit -- joint velocity, actuator acceleration, cylinder
      force and pump flow. **It defaults below one on purpose and raising it to
      one is not a speed setting.** 5.5's [!important] is the reason: a timing
      computed exactly at the limits saturates the actuators by construction, at
      every instant a limit binds, and the MPC's job is to add a corrective
      acceleration on top of the reference -- at saturation there is none left to
      add, so the controller's authority is zero precisely where the trajectory
      is hardest to track. The legacy planner expressed the same insight as a
      refusal to iterate its time-scale factor to unity; making it a named
      parameter is the change. It is **not** speed_scale: that is the caller's
      request on crane_msgs/PlanMotion, it touches the velocity bound alone, and
      no value of it raises this."
    validation:
      # (0, 1], matching solve_timing_ocp's own precondition. Zero is not a
      # cautious margin, it is no authority at all.
      bounds<>: [1.0e-12, 1.0]

  # ---------------------------------------------------------------------------
  # The rest of the OCP of wiki/trajectory_planning.md 5.2
  # ---------------------------------------------------------------------------
  #
  # **Why these are parameters at all.** They used to be the defaults on
  # `TimingOcpSettings` and nothing else, so tuning the OCP meant editing a C++
  # header and rebuilding, and `scripts/timing_a2b.py` -- which is the tool the
  # tuning is actually done with -- carried its own copy of every one of them.
  # Two copies of a number that has to agree is one copy too many. These are the
  # single place they are written down: the node reads them here and the offline
  # runner passes them to `crane_planning_timing_cli`, which defaults every one
  # of them from the same struct.
  #
  # They are read_only for the reason every other solve setting here is: a
  # weight that can be changed under a running planner makes two plans issued a
  # second apart incomparable.
  ocp:
    intervals:
      type: int
      default_value: 40
      read_only: true
      description: "Shooting intervals over sigma in [0, 1]. The grid the
        constraints of mpc 3 are actually imposed on, so it buys feasibility
        resolution rather than accuracy: a coarse grid can step over a force
        peak between two nodes. It also sets the solve cost, which is roughly
        linear in it. Four is the fewest that has an interior at all."
      validation:
        bounds<>: [4, 400]
    sway_weight:
      type: double
      default_value: 2.0
      read_only: true
      description: "Q_dot_u of 5.2's sway-energy regulariser, per passive
        coordinate, and the same weight on the terminal cost. It trades traversal
        time against how hard the timing works to keep the load still: raising it
        buys a quieter load and a slower move. **A design value** -- 5.2 names the
        term and not its weight, and no recording measures what an operator would
        accept. It is the first knob to reach for when a plan swings."
      validation:
        gt_eq<>: [0.0]
    input_weight:
      type: double
      default_value: 1.0e-3
      read_only: true
      description: "Regularisation on sigma_ddot. **Not a limit** -- the limit is
        sigma_accel_max below. It is small on purpose: large enough that the
        input is not free and the SQP has something to descend on where the
        traversal-time term is flat, small enough that it does not buy time back
        from the objective. Zero is allowed and leaves the input unregularised."
      validation:
        gt_eq<>: [0.0]
    sigma_rate_min:
      type: double
      default_value: 0.02
      read_only: true
      description: "Floor on sigma_dot. A numerical bound and not a machine
        number: the objective carries 1/sigma_dot, so a rate reaching zero makes
        the integrand singular. What the machine feels is q_a'(sigma) sigma_dot
        and that is bounded by the joint velocity limits off the description."
      validation:
        gt<>: [0.0]
    sigma_rate_max:
      type: double
      default_value: 2.0
      read_only: true
      description: "Ceiling on sigma_dot, and numerical for the mirror-image
        reason. At the two endpoints the path is stationary -- q_a' and q_a''
        both vanish -- so no joint limit constrains the rate there at all and
        something has to. Must be above sigma_rate_min."
      validation:
        gt<>: [0.0]
    sigma_accel_max:
      type: double
      default_value: 20.0
      read_only: true
      description: "Box on sigma_ddot, the OCP's input. Numerical, like the rate
        box: the physical accelerations are bounded by ddq_a_max below, and this
        keeps the input finite where q_a' vanishes and no physical row binds it."
      validation:
        gt<>: [0.0]
    dq_sway_max:
      type: double_array
      default_value: [1.0, 0.5]
      read_only: true
      description: "dq_u^+ of wiki/mpc.md 3 constraint 4, rad/s, over
        [tip, tilt] -- the order tip_tilt_state_broadcaster names them on
        /joint_states. The rate half of the sway box; the position half is the top-level
        q_sway_max, which the collision envelope of trajectory_planning 4.3
        shares and which is therefore not repeated here. **A design value**, on
        the same footing as q_sway_max: it is the rate a 2.5 m pendulum reaches
        at that swing."
      validation:
        fixed_size<>: [2]
        # Strictly positive. A zero here is not a tight bound, it is a zero-width
        # box on the dq_u rows at every interior stage -- exactly the singular log
        # barrier the start_resolution windows below exist to avoid -- and unlike
        # the other limits the solver has no check of its own for it.
        element_bounds<>: [1.0e-12, 10.0]
    ddq_a_max:
      type: double_array
      default_value: [0.5, 0.7, 0.5, 1.0, 6.0, 2.0]
      read_only: true
      description: "ddq^max of wiki/implementation/parameters.md 3, over the six
        actuated coordinates in canonical order (slew, boom, arm, telescope,
        rotator, tool). The description carries position and velocity limits and
        **not** acceleration ones, which is why these are written down here and
        the other two are not. The OCP bounds the five path rows; the sixth is
        the tool and is pinned rather than timed, so its entry is carried for
        shape and never binds. **A design value.**"
      validation:
        fixed_size<>: [6]
        # Strictly positive, not merely non-negative: solve_timing_ocp refuses a
        # zero acceleration limit by name, and a bound that admits zero moves
        # that refusal from bringup to the first plan request. The floor is the
        # smallest positive number this validator can express.
        element_bounds<>: [1.0e-12, 1000.0]
    max_wall_clock:
      type: double
      default_value: 12.0
      read_only: true
      description: "The share of trajectory_planning 7's latency the solve may
        spend, s, enforced inside acados rather than in a caller's timeout. Sized
        against what a solve costs rather than round -- a straight move converges
        in some 4 s here -- because a bound is only a bound if the ordinary case
        clears it on a slower machine. plan_motion lowers it to whatever
        latency_budget has left when the solve opens, so the two cannot disagree
        about which of them fired."
      validation:
        gt<>: [0.0]
    max_iterations:
      type: int
      default_value: 250
      read_only: true
      description: "SQP iteration cap. Hitting it is a refusal carrying acados'
        own status word, never a clipped trajectory. **The one setting the
        generated artifact caps rather than carries**: acados sizes the SQP
        statistics array from it at code generation, so raising it past what the
        shipped solver allocated is a re-export
        (`./scripts/export_timing_ocp.py`) and not a setting. The bound below is
        that allocation."
      validation:
        bounds<>: [1, 250]
    tolerance_stationarity:
      type: double
      default_value: 1.0e-4
      read_only: true
      description: "When the SQP's stationarity residual is small enough to stop.
        Separate from the feasibility tolerance on purpose: this residual is in
        the units of the objective's gradient, which carries 1/sigma_dot and its
        square root, so it is a couple of decades larger than the constraint
        residuals for the same quality of answer. Asking it for 1e-6 spends the
        whole iteration budget polishing a trajectory that stopped changing."
      validation:
        gt<>: [0.0]
    tolerance_feasibility:
      type: double
      default_value: 1.0e-6
      read_only: true
      description: "The equality, inequality and complementarity tolerances,
        which share a value. These residuals are in the units of the constraints
        -- rad/s^2, newtons, m^3/s -- and 1e-6 there is far below anything the
        machine can be commanded at."
      validation:
        gt<>: [0.0]
    levenberg_marquardt:
      type: double
      default_value: 1.0e-2
      read_only: true
      description: "Levenberg-Marquardt term on the Gauss-Newton Hessian. **Not
        a taste.** The traversal-time term is 1/sigma_dot, whose curvature falls
        as the rate rises, so the Hessian is nearly flat exactly where the
        optimum is and an unregularised step leaves the region the model is valid
        on. Lowering it is the second thing to try when a solve reports
        ACADOS_QP_FAILURE; raising it slows convergence rather than breaking it."
      validation:
        gt_eq<>: [0.0]

  start_resolution:
    q_u:
      type: double
      default_value: 1.0e-2
      read_only: true
      description: "How wide a window stage 0's measured sway angle is held
        inside, rad. **A solver number first and a measurement number second.**
        A zero-width box is where an interior-point method breaks down and HPIPM
        is no exception: with every stage-0 row pinned exactly, solves come back
        ACADOS_QP_FAILURE on the first QP. 1e-3 still fails and 1e-2 converges,
        by sweep. That 1e-3 is also the gyro quantiser's own scale is what makes
        it a trap -- the sensor-resolution argument gives a number an order of
        magnitude too small to be the fix. The window costs what it says: a
        minimum-time objective spends slack, so the initial condition is honoured
        to this tolerance and not exactly."
      validation:
        gt<>: [0.0]
    dq_u:
      type: double
      default_value: 1.0e-2
      read_only: true
      description: "The same window on the measured sway rate, rad/s, for the
        same reason and measured the same way."
      validation:
        gt<>: [0.0]
    sigma_rate_fraction:
      type: double
      default_value: 2.0e-2
      read_only: true
      description: "The window on the pinned sigma_dot(0), as a **fraction** of
        the pinned rate itself. Relative and not absolute because sigma_dot is a
        path rate and its scale is the path's. In the machine's own terms it is
        directly the fraction by which the first emitted joint velocity may
        differ from the measured one, since dq_a(0) = q_a'(0) sigma_dot(0). Both
        edges stand off: with the box's lower edge on the measurement the first
        QP returns a NaN, and opening only that edge converges to a rate below
        the measurement, which is not the boundary condition 7 asked for."
      validation:
        gt<>: [0.0]

  pump_flow_max:
    type: double
    default_value: 0.0014
    read_only: true
    description: "Q_P^max of wiki/implementation/parameters.md 4, m^3/s, the
      right-hand side of mpc.md 3 constraint 7 before the planning factor below.
      **Measured 2023, pre-retrofit, not re-verified** -- parameters.md states the
      provenance in the same sentence as the number and config/hydraulic_limits.yaml
      carries both. Pre-retrofit means it was measured on a machine that has since
      been rebuilt; not re-verified means nobody has checked the pump on the crane
      today still delivers it."
    validation:
      gt<>: [0.0]

  pump_flow_planning_factor:
    type: double
    default_value: 0.95
    read_only: true
    description: "The 0.95x parameters.md 4 prescribes for using Q_P^max in
      planning. **Not a second kappa**: it is the discount that one weakly
      evidenced number has always carried, it applies to the pump flow alone, and
      it was already in force in the legacy planner's retiming. kappa is the
      separate, larger reservation applied to every limit. The two multiply and
      neither substitutes for the other."
    validation:
      bounds<>: [1.0e-12, 1.0]

  system_pressure_pa:
    type: double
    default_value: 25000000.0
    read_only: true
    description: "The hydraulic relief setting F_i^max is derived from, Pa.
      trajectory_planning 3 records that no existing planner enforces the cylinder
      force limit, so there is no earlier number to inherit, and parameters.md
      carries the chamber areas but no relief setting at all -- its 7 lists the
      pressure constants among its gaps. The areas are asked of the model rather
      than declared here, so they cannot drift from the description; this is the
      one number that cannot be derived. **The default is a plausible 250 bar for
      a crane of this class, not a reading off this machine.**
      config/hydraulic_limits.yaml is where that is written down at length."
    validation:
      gt<>: [0.0]
